[project]
name = "reply-assistant"
version = "0.1.0"
description = "Backend for the WhatsApp reply assistant"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.13.0",
    "apscheduler>=3.11.3",
    "bcrypt>=5.0.0",
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "itsdangerous>=2.2.0",
    "langgraph>=1.2.14",
    "numpy>=2.5.3",
    "openai>=3.27.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqladmin>=0.32.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# The local alembic/ folder makes ruff think "alembic" is first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
